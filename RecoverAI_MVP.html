    /* ─── RECOVERY HUB ─── */
    function RecoveryHub({ invoices, openDetail, settings }) {
      const [selected, setSelected] = useState(null);
      const [msgType, setMsgType] = useState('whatsapp');
      const [aiMsg, setAiMsg] = useState('');
      const [loading, setLoading] = useState(false);
      const [copied, setCopied] = useState(false);

      const active = invoices.filter(i => !i.recovered).sort((a, b) => b.daysOverdue - a.daysOverdue);
      const sel = selected ? (invoices.find(i => i.id === selected) || null) : null;

      async function generate() {
        if (!sel) return;
        setLoading(true); setAiMsg(''); setCopied(false);
        const idata = sel.interest_data || {};
        const penalty = idata.interest_accrued || 0;
        const totalClaim = idata.total_claim || sel.amount;
        const prompts = {
          whatsapp: sel.daysOverdue >= 45
            ? `Draft a WhatsApp recovery message for:\nDebtor: ${sel.contact}, ${sel.company}\nPhone: ${sel.phone}\nInvoice: ${sel.invoiceNo}\nBase Amount: ${fmtINR(sel.amount)}\nMSMED Act Penalty (19.5% p.a. compound): ${fmtINR(penalty)}\nTotal Legal Claim: ${fmtINR(totalClaim)}\nDays Overdue: ${sel.daysOverdue}\nSender: ${settings.businessName} (${settings.ownerName})\nTone: firm, cite MSMED Act 2006. Max 5 lines. State exact penalty and total claim. Mention MSME Samadhaan filing as next step.`
            : `Draft a WhatsApp recovery message for:\nDebtor: ${sel.contact}, ${sel.company}\nPhone: ${sel.phone}\nInvoice: ${sel.invoiceNo} for ${fmtINR(sel.amount)}\nDue: ${sel.dueDate} (${sel.daysOverdue} days overdue)\nSender: ${settings.businessName} (${settings.ownerName})\nTone: polite but firm. Max 5 lines. Include payment UPI request mention.`,
          email: sel.daysOverdue >= 45
            ? `Draft a professional recovery email:\nTo: ${sel.contact} <${sel.email}>\nCompany: ${sel.company}\nInvoice: ${sel.invoiceNo}\nBase Amount: ${fmtINR(sel.amount)}\nMSMED Act Penalty (19.5% p.a. compound): ${fmtINR(penalty)}\nTotal Legal Claim: ${fmtINR(totalClaim)}\nDays Overdue: ${sel.daysOverdue}\nSender: ${settings.businessName}\nInclude Subject line. Cite MSMED Act 2006 §15-17. State exact interest and total claim. Demand immediate payment to avoid MSME Samadhaan filing.`
            : `Draft a professional recovery email:\nTo: ${sel.contact} <${sel.email}>\nCompany: ${sel.company}\nInvoice: ${sel.invoiceNo} for ${fmtINR(sel.amount)}\nDue: ${sel.dueDate} (${sel.daysOverdue} days overdue)\nSender: ${settings.businessName}\nInclude Subject line. Professional tone. Offer payment arrangement.`,
          legal: `Draft a formal MSME Legal Notice:\nDebtor: ${sel.company}, Contact: ${sel.contact}\nInvoice: ${sel.invoiceNo}\nBase Amount: ${fmtINR(sel.amount)}\nMSMED Act Penalty (19.5% p.a. compound interest with monthly rests): ${fmtINR(penalty)}\nTotal Legal Claim: ${fmtINR(totalClaim)}\nOriginal due: ${sel.dueDate} (now ${sel.daysOverdue} days overdue)\nSender: ${settings.businessName}, ${settings.gstin}\nRequirements: Cite MSMED Act 2006 Sections 15-17, give 15-day ultimatum, state EXACT interest of ${fmtINR(penalty)} at 3x RBI bank rate (19.5% p.a.), demand total of ${fmtINR(totalClaim)}, mention MSME Samadhaan portal filing.`,
        };
        try {
          const msg = await callAI(SYSTEM_PROMPT, prompts[msgType]);
          setAiMsg(msg);
        } catch (e) {
          setAiMsg(`Error: ${e.message}`);
        }
        setLoading(false);
      }

      function copy() {
        navigator.clipboard.writeText(aiMsg).catch(() => { });
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }

      const getTimeline = (inv) => [
        { label: 'Invoice Issued', desc: `${inv.invoiceNo} sent for ${fmtINR(inv.amount)}`, done: true, dot: 'done', date: inv.issueDate },
        { label: '1st Reminder (Day 7)', desc: 'Polite WhatsApp/Email reminder', done: inv.reminders >= 1, dot: inv.reminders >= 1 ? 'done' : inv.daysOverdue >= 7 ? 'active' : 'pending', date: '' },
        { label: 'Follow-up (Day 21)', desc: 'Second reminder with payment link', done: inv.reminders >= 2, dot: inv.reminders >= 2 ? 'done' : inv.daysOverdue >= 21 ? 'active' : 'pending', date: '' },
        { label: 'Final Notice (Day 35)', desc: 'Strongly worded escalation message', done: inv.reminders >= 3, dot: inv.reminders >= 3 ? 'done' : inv.daysOverdue >= 35 ? 'active' : 'pending', date: '' },
        { label: 'Legal Draft (Day 45+)', desc: 'MSME Samadhaan / Letter Before Action', done: inv.daysOverdue >= 45, dot: inv.daysOverdue >= 45 ? 'legal' : 'pending', date: '' },
        { label: 'Payment Recovered', desc: 'Invoice closed and marked recovered', done: inv.recovered, dot: inv.recovered ? 'done' : 'pending', date: '' },
      ];

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Recovery Hub</div>
              <div className="page-sub">Generate AI-powered recovery messages for each invoice</div>
            </div>
          </div>
          <div className="content">
            <div className="recovery-grid">

              {/* Invoice list */}
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text3)', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.5px' }}>Active Invoices ({active.length})</div>
                {active.map(inv => (
                  <div key={inv.id} onClick={() => { setSelected(inv.id); setAiMsg(''); setCopied(false); }}
                    style={{ padding: '10px 12px', border: `1.5px solid ${selected === inv.id ? 'var(--amber)' : 'var(--border)'}`, borderRadius: 'var(--radius-lg)', marginBottom: 8, cursor: 'pointer', background: selected === inv.id ? '#FAEEDA' : 'var(--surface)', transition: 'all 0.15s' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{inv.company}</div>
                      <span className={`badge ${daysBadge(inv.daysOverdue, false)}`} style={{ fontSize: 10 }}>{inv.daysOverdue}d</span>
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>{inv.invoiceNo}</div>
                    <div style={{ fontSize: 13, fontWeight: 700, marginTop: 4, color: 'var(--amber)' }}>{fmtINR(inv.amount)}</div>
                  </div>
                ))}
                {active.length === 0 && <div className="empty" style={{ padding: 24 }}><div className="empty-icon">🎉</div><div className="empty-title">All clear!</div><div className="empty-sub">No active invoices</div></div>}
              </div>

              {/* Right panel */}
              {sel ? (
                <div>
                  {/* Header */}
                  <div className="card" style={{ marginBottom: 12 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 700 }}>{sel.company}</div>
                        <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{sel.contact} · {sel.phone} · {sel.email}</div>
                      </div>
                      <span className={`badge ${daysBadge(sel.daysOverdue, false)}`}>{STATUS_META[sel.status]?.label}</span>
                    </div>
                    <div className="detail-grid">
                      {[['Invoice', sel.invoiceNo], ['Amount', fmtINR(sel.amount)], ['Due Date', sel.dueDate], ['Days Overdue', sel.daysOverdue + 'd overdue'], ['Channel', sel.channel], ['Industry', sel.industry]].map(([l, v]) => (
                        <div key={l} className="detail-item"><div className="detail-label">{l}</div><div className="detail-value">{v}</div></div>
                      ))}
                    </div>
                    {sel.notes && <div className="info-box" style={{ marginBottom: 0 }}>📝 <strong>Notes:</strong> {sel.notes}</div>}
                  </div>

                  {/* Timeline */}
                  <div className="card" style={{ marginBottom: 12 }}>
                    <div className="card-header"><div className="card-title">Recovery Timeline</div></div>
                    <div className="timeline">
                      {getTimeline(sel).map((t, i, arr) => (
                        <div key={i} className="timeline-item">
                          <div className="timeline-left">
                            <div className={`timeline-dot ${t.dot}`}></div>
                            {i < arr.length - 1 && <div className="timeline-line"></div>}
                          </div>
                          <div className="timeline-content">
                            <div className="timeline-title" style={{ color: t.done ? 'var(--text)' : 'var(--text3)' }}>{t.label}</div>
                            <div className="timeline-desc">{t.desc}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* AI Generator */}
                  <div className="card">
                    <div className="card-header">
                      <div className="card-title">AI Message Generator</div>
                      <span className="badge badge-purple">Claude AI</span>
                    </div>

                    <div className="tabs" style={{ marginBottom: 12 }}>
                      {[['whatsapp', '💬 WhatsApp'], ['email', '📧 Email'], ['legal', '⚖ Legal Notice']].map(([v, l]) => (
                        <button key={v} className={`tab-btn${msgType === v ? ' active' : ''}`} onClick={() => { setMsgType(v); setAiMsg(''); setCopied(false) }}
                          style={{ color: v === 'legal' && msgType === v ? 'var(--red)' : undefined }}>
                          {l}
                        </button>
                      ))}
                    </div>

                    {msgType === 'legal' && sel.daysOverdue < 45 && (
                      <div className="warn-box">⚠ Legal notices are most effective after 45 days. This invoice is only {sel.daysOverdue} days overdue. Consider sending a final reminder first.</div>
                    )}
                    {msgType === 'legal' && sel.daysOverdue >= 45 && (
                      <div className="danger-box">📋 This invoice qualifies for MSME Samadhaan filing (45+ days overdue). The generated notice will reference the MSMED Act 2006.</div>
                    )}

                    <button className="btn btn-primary btn-lg" style={{ width: '100%', justifyContent: 'center', marginBottom: 12 }} onClick={generate} disabled={loading}>
                      {loading ? <><span className="spinner"></span>Generating...</> : `Generate ${msgType === 'whatsapp' ? 'WhatsApp Message' : msgType === 'email' ? 'Email Draft' : 'Legal Notice'}`}
                    </button>

                    {loading && <div className="ai-loading"><span className="spinner"></span>AI is drafting your message...</div>}

                    {aiMsg && !loading && (
                      <div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                          <span style={{ fontSize: 11, color: 'var(--text3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.4px' }}>Generated Message</span>
                          <button className={`btn btn-sm${copied ? ' copy-flash' : ''}`} onClick={copy}>{copied ? '✓ Copied' : 'Copy'}</button>
                        </div>
                        <div className="ai-box">{aiMsg}</div>
                        <div style={{ display: 'flex', gap: 6, marginTop: 10, justifyContent: 'flex-end', flexWrap: 'wrap' }}>
                          <button className="btn btn-sm" onClick={() => setAiMsg('')}>Clear</button>
                          <button className="btn btn-sm" onClick={generate}>Regenerate</button>
                          {msgType === 'whatsapp' && <button className="btn btn-sm btn-success" onClick={() => window.open(`https://wa.me/${sel.phone.replace(/\D/g, '')}?text=${encodeURIComponent(aiMsg)}`, '_blank')}>Send via WhatsApp ↗</button>}
                          {msgType === 'legal' && <button className="btn btn-sm btn-danger">Download PDF Notice</button>}
                        </div>
                      </div>
                    )}

                    {!aiMsg && !loading && (
                      <div style={{ textAlign: 'center', padding: '20px 0', color: 'var(--text3)', fontSize: 12 }}>
                        Click the button above to generate a contextual AI message for {sel.company}
                      </div>
                    )}
                  </div>
                </div>
              ) : (
                <div className="card" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 400, textAlign: 'center' }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>←</div>
                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Select an invoice to begin</div>
                  <div style={{ fontSize: 12, color: 'var(--text3)', maxWidth: 240 }}>Pick any overdue invoice from the left panel to generate AI-powered recovery messages</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ─── LEGAL QUEUE ─── */
    function LegalQueue({ invoices, openDetail, settings }) {
      const [selected, setSelected] = useState(null);
      const [aiNotice, setAiNotice] = useState('');
      const [loading, setLoading] = useState(false);
      const [copied, setCopied] = useState(false);
      const sel = selected ? invoices.find(i => i.id === selected) : null;

      // Compute totals using live interest_data from backend
      const totalPrincipal = invoices.reduce((s, i) => s + i.amount, 0);
      const totalClaim = invoices.reduce((s, i) => s + (i.interest_data?.total_claim || i.amount), 0);
      const totalInterest = invoices.reduce((s, i) => s + (i.interest_data?.interest_accrued || 0), 0);

      // Helper to safely read interest_data with fallbacks
      function idata(inv) {
        const d = inv.interest_data || {};
        return {
          interest: d.interest_accrued || 0,
          claim: d.total_claim || inv.amount,
          days: d.days_overdue || inv.daysOverdue || 0,
          rate: d.annual_rate_pct || 19.5,
          basis: d.legal_basis || 'MSMED Act 2006, §15–17',
        };
      }

      async function generateNotice() {
        if (!sel) return;
        setLoading(true); setAiNotice(''); setCopied(false);
        const id = idata(sel);
        try {
          const msg = await callAI(SYSTEM_PROMPT,
            `Draft a complete formal MSME Legal Notice / Letter Before Action for:\n\nSENDER:\nBusiness: ${settings.businessName}\nOwner: ${settings.ownerName}\nPhone: ${settings.phone}\nEmail: ${settings.email}\nGSTIN: ${settings.gstin}\n\nDEBTOR:\nCompany: ${sel.company}\nContact: ${sel.contact}\nPhone: ${sel.phone}\nGSTIN: ${sel.gstin || 'N/A'}\n\nINVOICE DETAILS:\nInvoice No: ${sel.invoiceNo}\nIssue Date: ${sel.issueDate}\nDue Date: ${sel.dueDate}\nBase Amount: ${fmtINR(sel.amount)}\nDays Overdue: ${id.days}\nMSMED Act Penalty (19.5% p.a. compound with monthly rests): ${fmtINR(id.interest)}\nTotal Legal Claim: ${fmtINR(id.claim)}\n\nRequirements:\n1. Formal legal notice header with date\n2. Cite MSMED Act 2006, Sections 15, 16, 17\n3. State EXACT interest of ${fmtINR(id.interest)} accrued at 3x Reserve Bank rate (19.5% p.a.)\n4. Demand TOTAL payment of ${fmtINR(id.claim)} within 15 days of this notice\n5. Mention filing with MSME Samadhaan portal as next step\n6. Professional legal closing\n7. Signature block for ${settings.ownerName}, ${settings.businessName}`
          );
          setAiNotice(msg);
        } catch (e) { setAiNotice(`Error: ${e.message}`); }
        setLoading(false);
      }

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Legal Queue</div>
              <div className="page-sub">{invoices.length} invoices qualify for legal action (45+ days overdue)</div>
            </div>
            <div className="topbar-actions" style={{ display: 'flex', gap: 8 }}>
              <span className="badge badge-amber" style={{ fontSize: 11 }}>Principal: {fmtINR(totalPrincipal)}</span>
              <span className="badge badge-red" style={{ fontSize: 12 }}>Total Claim: {fmtINR(totalClaim)}</span>
            </div>
          </div>
          <div className="content">

            {invoices.length === 0 && <div className="empty"><div className="empty-icon">⚖</div><div className="empty-title">No invoices in legal queue</div><div className="empty-sub">Invoices 45+ days overdue will appear here</div></div>}

            <div className="legal-grid">
              <div>
                <div className="danger-box">
                  <strong>⚠ Action Required</strong><br />
                  These invoices are eligible for MSME Samadhaan filing under the MSMED Act 2006. Compound interest at 3× RBI bank rate (19.5% p.a.) has accrued <strong>{fmtINR(totalInterest)}</strong> in penalties.
                </div>
                {invoices.map(inv => {
                  const id = idata(inv);
                  return (
                    <div key={inv.id} onClick={() => { setSelected(inv.id); setAiNotice(''); setCopied(false); }}
                      style={{ padding: '12px', border: `1.5px solid ${selected === inv.id ? 'var(--red)' : 'var(--border)'}`, borderRadius: 'var(--radius-lg)', marginBottom: 8, cursor: 'pointer', background: selected === inv.id ? 'var(--red-bg)' : 'var(--surface)', transition: 'all 0.15s' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                        <div style={{ fontWeight: 700, fontSize: 13 }}>{inv.company}</div>
                        <span className="badge badge-red">{id.days}d overdue</span>
                      </div>
                      <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>{inv.contact} · {inv.invoiceNo}</div>
                      <div style={{ marginTop: 8, background: 'var(--red-bg)', borderRadius: 'var(--radius)', padding: '8px 10px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--text2)', marginBottom: 4 }}>
                          <span>Base: {fmtINR(inv.amount)}</span>
                          <span style={{ color: 'var(--red)', fontWeight: 600 }}>+{fmtINR(id.interest)} penalty</span>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div style={{ fontSize: 15, fontWeight: 800, color: 'var(--red)' }}>{fmtINR(id.claim)}</div>
                          <span className="badge badge-red" style={{ fontSize: 9 }}>Total Claim</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {sel ? (
                <div>
                  {/* ── Legal Claim Breakdown Card ── */}
                  <div className="card" style={{ marginBottom: 12 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: 700 }}>{sel.company}</div>
                        <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{sel.contact} · {sel.phone}</div>
                      </div>
                      <button className="btn btn-sm" onClick={() => openDetail(sel)}>Full Details →</button>
                    </div>

                    {/* Financial breakdown */}
                    {(() => {
                      const id = idata(sel);
                      return (
                        <div style={{ marginBottom: 14 }}>
                          <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 8 }}>⚖ Legal Claim Breakdown</div>
                          <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius)', overflow: 'hidden', border: '1px solid var(--border)' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 14px', borderBottom: '1px solid var(--border)' }}>
                              <span style={{ fontSize: 12, color: 'var(--text2)' }}>Base Invoice Amount</span>
                              <span style={{ fontSize: 13, fontWeight: 600 }}>{fmtINR(sel.amount)}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 14px', borderBottom: '1px solid var(--border)', background: 'var(--red-bg)' }}>
                              <span style={{ fontSize: 12, color: 'var(--red)' }}>MSMED Penalty ({id.rate}% p.a. × {id.days}d)</span>
                              <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--red)' }}>+{fmtINR(id.interest)}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', padding: '12px 14px', background: 'var(--surface)' }}>
                              <span style={{ fontSize: 13, fontWeight: 700 }}>Total Legal Claim</span>
                              <span style={{ fontSize: 16, fontWeight: 800, color: 'var(--red)' }}>{fmtINR(id.claim)}</span>
                            </div>
                          </div>
                          <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 6, textAlign: 'right' }}>{id.basis}</div>
                        </div>
                      );
                    })()}

                    <div className="info-box" style={{ marginBottom: 0 }}>
                      <strong>MSME Samadhaan Eligibility:</strong> This invoice has been overdue for {idata(sel).days} days. Under MSMED Act Section 15, payment was due within 45 days of delivery. You are entitled to compound interest at 3× the Reserve Bank of India's notified rate (19.5% p.a.).
                    </div>
                  </div>

                  {/* ── Legal Notice Generator ── */}
                  <div className="card">
                    <div className="card-header">
                      <div>
                        <div className="card-title">Legal Notice Generator</div>
                        <div className="card-sub">AI-drafted formal Letter Before Action</div>
                      </div>
                      <span className="badge badge-red">MSMED Act 2006</span>
                    </div>

                    <button className="btn btn-danger btn-lg" style={{ width: '100%', justifyContent: 'center', marginBottom: 12 }} onClick={generateNotice} disabled={loading}>
                      {loading ? <><span className="spinner"></span>Drafting Legal Notice...</> : '⚖ Generate Legal Notice'}
                    </button>

                    {loading && <div className="ai-loading"><span className="spinner"></span>Drafting formal legal notice with MSME Act references...</div>}

                    {aiNotice && !loading && (
                      <div>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6, flexWrap: 'wrap', gap: 6 }}>
                          <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.4px' }}>Legal Notice Draft</span>
                          <div style={{ display: 'flex', gap: 6 }}>
                            <button className={`btn btn-sm${copied ? ' copy-flash' : ''}`} onClick={() => { navigator.clipboard.writeText(aiNotice).catch(() => { }); setCopied(true); setTimeout(() => setCopied(false), 2000); }}>{copied ? '✓ Copied' : 'Copy'}</button>
                          </div>
                        </div>
                        <div className="ai-box" style={{ fontFamily: 'Georgia,serif', fontSize: 11, lineHeight: 1.9 }}>{aiNotice}</div>
                        <div style={{ marginTop: 10, display: 'flex', gap: 6, justifyContent: 'flex-end', flexWrap: 'wrap' }}>
                          <button className="btn btn-sm" onClick={generateNotice}>Regenerate</button>
                          <button className="btn btn-sm btn-success" onClick={() => sendViaWhatsApp(sel.phone, aiNotice)}>💬 Send via WhatsApp</button>
                          <button className="btn btn-sm btn-danger" onClick={() => generateLegalPDF(sel, settings)}>📄 Download PDF Notice</button>
                          <button className="btn btn-sm" style={{ color: 'var(--red)', borderColor: 'var(--red-light)' }}>File MSME Samadhaan →</button>

                      </div>
                    )}
                    {!aiNotice && !loading && <div style={{ textAlign: 'center', padding: '24px 0', color: 'var(--text3)', fontSize: 12 }}>Click above to generate a court-ready legal notice for {sel.company}</div>}
                  </div>
                </div>
              ) : (
                <div className="card" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 350, textAlign: 'center' }}>

                  <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Select a debtor</div>
                  <div style={{ fontSize: 12, color: 'var(--text3)', maxWidth: 220 }}>Choose an invoice from the left to generate a formal MSME legal notice</div>

              )}

          </div>
        </div>

    /* ─── DEBTOR INBOX ─── */
    function DebtorInbox({ invoices, openDetail, fetchInvoices }) {
      const [showSimModal, setShowSimModal] = useState(false);
      const [simInvoiceId, setSimInvoiceId] = useState('');
      const [simMessage, setSimMessage] = useState('');
      const [simLoading, setSimLoading] = useState(false);
      const [simResult, setSimResult] = useState(null);
      const [simError, setSimError] = useState('');

      const msgs = invoices.flatMap(inv =>
        (inv.communication_log || []).map(log => ({ ...log, inv }))
      ).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      // Active (non-recovered) invoices for the simulator dropdown
      const activeInvoices = invoices.filter(i => !i.recovered);

      async function handleSimSubmit(e) {
        e.preventDefault();
        if (!simInvoiceId || !simMessage.trim()) return;
        setSimLoading(true);
        setSimResult(null);
        setSimError('');
        try {
          const res = await fetch('/api/debtor-reply', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ invoice_id: simInvoiceId, message: simMessage.trim() }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Request failed');
          setSimResult(data);
          // CRITICAL: Refresh the invoice list so the inbox shows the new log entry
          fetchInvoices();
        } catch (err) {
          setSimError(err.message);
        }
        setSimLoading(false);
      }

      function closeModal() {
        setShowSimModal(false);
        setSimMessage('');
        setSimInvoiceId('');
        setSimResult(null);
        setSimError('');
      }

      const intentBadge = intent =>
        intent === 'promise_to_pay' ? 'badge-green' :
          intent === 'dispute' ? 'badge-red' :
            intent === 'stall' ? 'badge-amber' : 'badge-gray';

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Debtor Inbox</div>
              <div className="page-sub">{msgs.length} message{msgs.length !== 1 ? 's' : ''} · AI-classified replies</div>
            </div>
            <div className="topbar-actions">
              <button
                id="btn-simulate-reply"
                className="btn btn-primary"
                onClick={() => setShowSimModal(true)}
                title="Simulate an incoming debtor reply to test the NLP pipeline"
              >
                ⚡ Simulate Incoming Reply
              </button>
            </div>
          </div>

          <div className="content">
            {msgs.length === 0 ? (
              <div className="empty" style={{ textAlign: 'center', padding: '60px 20px' }}>
                <div className="empty-icon" style={{ fontSize: 40, marginBottom: 16 }}>📥</div>
                <div className="empty-title" style={{ fontSize: 18, fontWeight: 700 }}>Inbox Zero</div>
                <div className="empty-sub" style={{ color: 'var(--text3)', marginBottom: 20 }}>
                  No debtor replies yet. Use the ⚡ button above to simulate one!
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {msgs.map((msg, i) => (
                  <div key={i} className="card inbox-msg-grid" onClick={() => openDetail(msg.inv)} style={{ overflow: 'hidden' }}>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{msg.inv.company}</div>
                      <div style={{ fontSize: 11, color: 'var(--text3)' }}>{msg.inv.contact}</div>
                      <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 8 }}>{new Date(msg.timestamp).toLocaleString()}</div>
                    </div>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>Original: "{msg.raw_message}"</div>
                      <div style={{ fontSize: 13, fontWeight: 500, wordBreak: 'break-word' }}>{msg.translated_text}</div>
                    </div>
                    <div>
                      <span className={`badge ${intentBadge(msg.intent)}`}>
                        {(msg.intent || 'unknown').replace(/_/g, ' ').toUpperCase()}
                      </span>
                      <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 4 }}>Conf: {msg.confidence}</div>
                      <div style={{ fontSize: 11, color: 'var(--amber)', marginTop: 4 }}>{msg.suggested_action}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ── Simulate Incoming Reply Modal ── */}
          {showSimModal && (
            <div className="overlay" onClick={closeModal}>
              <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 480 }}>
                <div className="modal-header">
                  <div>
                    <div className="modal-title">⚡ Simulate Incoming Reply</div>
                    <div className="modal-sub">Test the NLP pipeline — select an invoice and type a debtor message</div>
                  </div>
                  <button className="close-btn" onClick={closeModal}>×</button>
                </div>

                {!simResult ? (
                  <form onSubmit={handleSimSubmit}>
                    <div className="form-group">
                      <label className="form-label" htmlFor="sim-invoice-select">Invoice / Debtor</label>
                      <select
                        id="sim-invoice-select"
                        className="form-input"
                        value={simInvoiceId}
                        onChange={e => setSimInvoiceId(e.target.value)}
                        required
                      >
                        <option value="">— Select an invoice —</option>
                        {activeInvoices.map(inv => (
                          <option key={inv.id} value={inv.id}>
                            {inv.company} · {inv.invoiceNo} · ₹{Number(inv.amount).toLocaleString('en-IN')}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="form-group">
                      <label className="form-label" htmlFor="sim-message-input">Debtor Message</label>
                      <textarea
                        id="sim-message-input"
                        className="form-input"
                        rows={4}
                        placeholder='e.g. "Kal payment bhej deta hoon sir" or "Wrong amount hai, dispute karna chahta hoon"'
                        value={simMessage}
                        onChange={e => setSimMessage(e.target.value)}
                        style={{ resize: 'vertical', fontFamily: 'DM Sans, sans-serif' }}
                        required
                      />
                      <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 4 }}>
                        💡 Try Hindi/Hinglish: "kal bhej dunga", "galat invoice hai", "boss nahi hain abhi"
                      </div>
                    </div>

                    {simError && (
                      <div className="danger-box" style={{ marginBottom: 12 }}>❌ {simError}</div>
                    )}

                    <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                      <button type="button" className="btn" onClick={closeModal}>Cancel</button>
                      <button
                        type="submit"
                        className="btn btn-primary"
                        disabled={simLoading || !simInvoiceId || !simMessage.trim()}
                        id="btn-simulate-submit"
                      >
                        {simLoading
                          ? <><span className="spinner" />&nbsp;Processing NLP...
                          </>
                          : '⚡ Send & Analyse'}
                      </button>
                    </div>
                  </form>
                ) : (
                  <div>
                    <div className="info-box" style={{ marginBottom: 16 }}>
                      ✅ Reply processed! The Inbox has been refreshed with the new AI analysis.
                    </div>

                    {simResult.fallback_mode && (
                      <div className="warn-box" style={{ marginBottom: 12 }}>
                        ⚡ <strong>Heuristic Fallback Active</strong> — Gemini API quota reached.
                        Intent was classified using keyword matching on your message.
                      </div>
                    )}

                    <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius)', padding: 14, marginBottom: 16 }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                        <span style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.4px', color: 'var(--text3)' }}>AI Analysis Result</span>
                        <span className={`badge ${intentBadge(simResult.intent)}`} style={{ fontSize: 12 }}>
                          {(simResult.intent || 'unknown').replace(/_/g, ' ').toUpperCase()}
                        </span>
                      </div>
                      <div style={{ display: 'grid', gap: 8 }}>
                        {[['Translation', simResult.translated_text], ['Confidence', simResult.confidence?.toUpperCase()], ['Suggested Action', simResult.suggested_action]].map(([lbl, val]) => (
                          <div key={lbl}>
                            <div style={{ fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 2 }}>{lbl}</div>
                            <div style={{ fontSize: 12, fontWeight: 500 }}>{val}</div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                      <button className="btn" onClick={() => { setSimResult(null); setSimMessage(''); setSimInvoiceId(''); setSimError(''); }}>
                        ← Send Another
                      </button>
                      <button className="btn btn-primary" onClick={closeModal}>Done</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── CAMPAIGNS ─── */

    function Campaigns({ invoices, settings }) {
      const [showRunner, setShowRunner] = useState(false);
      const [sort, setSort] = useState('days_desc');

      // Filter: only active, overdue, non-recovered invoices
      const targets = invoices
        .filter(i => !i.recovered && i.daysOverdue > 0)
        .sort((a, b) => {
          if (sort === 'days_desc') return b.daysOverdue - a.daysOverdue;
          if (sort === 'days_asc') return a.daysOverdue - b.daysOverdue;
          if (sort === 'amount_desc') return (b.interest_data?.total_claim || b.amount) - (a.interest_data?.total_claim || a.amount);
          if (sort === 'amount_asc') return (a.interest_data?.total_claim || a.amount) - (b.interest_data?.total_claim || b.amount);
          return 0;
        });

      const totalClaim = targets.reduce((s, i) => s + (i.interest_data?.total_claim || i.amount), 0);
      const avgDays = targets.length ? Math.round(targets.reduce((s, i) => s + i.daysOverdue, 0) / targets.length) : 0;

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Campaigns</div>
              <div className="page-sub">{targets.length} active overdue invoices ready for bulk recovery</div>
            </div>
            <div className="topbar-actions">
              <span className="badge badge-amber" style={{ fontSize: 11 }}>Total Claim: {fmtINR(totalClaim)}</span>
            </div>
          </div>
          <div className="content">

            {/* Hero Action */}
            <div style={{ background: 'linear-gradient(135deg, var(--amber-bg) 0%, var(--surface) 100%)', border: '2px solid var(--amber-light)', borderRadius: 'var(--radius-xl)', padding: '28px 32px', marginBottom: 20, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 800, color: 'var(--amber-dark)', marginBottom: 4 }}>🚀 Rapid Fire WhatsApp Campaign</div>
                <div style={{ fontSize: 13, color: 'var(--text2)', lineHeight: 1.6 }}>
                  Process <strong>{targets.length} debtors</strong> one‑by‑one without triggering popup blockers.<br />
                  AI drafts each message → you review → click Send & Next → repeat.
                </div>
              </div>
              <button
                className="btn btn-primary btn-lg"
                id="btn-start-whatsapp-campaign"
                style={{ padding: '14px 32px', fontSize: 16, fontWeight: 700, borderRadius: 'var(--radius-lg)', boxShadow: '0 4px 16px rgba(186,117,23,0.3)' }}
                onClick={() => setShowRunner(true)}
                disabled={targets.length === 0}
              >
                💬 Start WhatsApp Campaign
              </button>
            </div>

            {/* Summary Metrics */}
            <div className="admin-metric-grid">
              <div className="metric-card">
                <div className="metric-label">🎯 Campaign Targets</div>
                <div className="metric-value" style={{ color: 'var(--amber)' }}>{targets.length}</div>
                <div className="metric-change"><span style={{ fontSize: 11, color: 'var(--text3)' }}>Active overdue invoices</span></div>
              </div>
              <div className="metric-card">
                <div className="metric-label">💰 Total Claim Value</div>
                <div className="metric-value" style={{ color: 'var(--red)' }}>{fmtINR(totalClaim)}</div>
                <div className="metric-change"><span style={{ fontSize: 11, color: 'var(--text3)' }}>Including MSMED penalties</span></div>
              </div>
              <div className="metric-card">
                <div className="metric-label">📅 Avg Days Overdue</div>
                <div className="metric-value">{avgDays}d</div>
                <div className="metric-change"><span style={{ fontSize: 11, color: 'var(--text3)' }}>Across all targets</span></div>
              </div>
            </div>

            {/* Campaign Target List */}
            <div className="card" style={{ padding: 0 }}>
              <div style={{ padding: '14px 16px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>Campaign Target List</div>
                  <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>Overdue invoices eligible for WhatsApp recovery blitz</div>
                </div>
                <select className="filter-select" value={sort} onChange={e => setSort(e.target.value)}>
                  <option value="days_desc">Most overdue first</option>
                  <option value="days_asc">Least overdue first</option>
                  <option value="amount_desc">Highest claim first</option>
                  <option value="amount_asc">Lowest claim first</option>
                </select>
              </div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: 40, textAlign: 'center' }}>#</th>
                      <th>Company</th>
                      <th>Contact</th>
                      <th>Invoice</th>
                      <th>Days Overdue</th>
                      <th>Status</th>
                      <th style={{ textAlign: 'right' }}>Total Claim</th>
                    </tr>
                  </thead>
                  <tbody>
                    {targets.length === 0 && (
                      <tr className="mobile-table-row"><td colSpan={7} className="mobile-td" style={{ justifyContent: 'center' }}>

                          <div className="empty-title">No overdue invoices</div>
                          <div className="empty-sub">All invoices are recovered or current!</div>

                      const claim = inv.interest_data?.total_claim || inv.amount;
                      return (
                        <tr key={inv.id} className="mobile-table-row">

                              <div style={{ width: 32, height: 32, borderRadius: 8, background: 'var(--amber-bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: 'var(--amber-dark)', flexShrink: 0 }}>{getInitials(inv.company)}</div>

                          <td data-label="Invoice" className="mobile-td"><span className="tag">{inv.invoiceNo}</span></td>
                          <td data-label="Days Overdue" className="mobile-td"><span className={`badge ${daysBadge(inv.daysOverdue, false)}`}>{inv.daysOverdue}d</span></td>
                          <td data-label="Status" className="mobile-td"><span className={`badge ${STATUS_META[inv.status]?.color || 'badge-gray'}`}>{STATUS_META[inv.status]?.label || inv.status}</span></td>
                          <td data-label="Total Claim" className="mobile-td" style={{ textAlign: 'right' }}>
                            <div style={{ fontWeight: 700, fontSize: 13 }}>{fmtINR(claim)}</div>
                            {inv.interest_data?.interest_accrued > 0 && (
                              <div style={{ fontSize: 10, color: 'var(--red)', marginTop: 2 }}>+{fmtINR(inv.interest_data.interest_accrued)} penalty</div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {targets.length > 0 && (
                <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', fontSize: 12, color: 'var(--text3)' }}>
                  <span>{targets.length} invoice{targets.length !== 1 ? 's' : ''} in campaign queue</span>
                  <span>Total: <strong style={{ color: 'var(--amber)' }}>{fmtINR(totalClaim)}</strong></span>
                </div>
              )}
            </div>
          </div>

          {/* Campaign Runner Modal */}
          {showRunner && <CampaignRunnerModal targets={targets} settings={settings} onClose={() => setShowRunner(false)} />}
        </div>
      );
    }

    /* ─── CAMPAIGN RUNNER MODAL (Rapid Fire WhatsApp Engine) ─── */
    function CampaignRunnerModal({ targets, settings, onClose }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [aiMsg, setAiMsg] = useState('');
      const [loading, setLoading] = useState(false);
      const [sentCount, setSentCount] = useState(0);
      const [finished, setFinished] = useState(false);
      const [skippedIds, setSkippedIds] = useState(new Set());

      const inv = targets[currentIdx] || null;
      const total = targets.length;
      const progressPct = total > 0 ? Math.round(((sentCount + skippedIds.size) / total) * 100) : 0;

      // Auto-generate message for the current invoice
      useEffect(() => {
        if (!inv || finished) return;
        let cancelled = false;
        async function generate() {
          setLoading(true);
          setAiMsg('');
          const idata = inv.interest_data || {};
          const penalty = idata.interest_accrued || 0;
          const totalClaim = idata.total_claim || inv.amount;
          const prompt = inv.daysOverdue >= 45
            ? `Draft a WhatsApp recovery message for:\nDebtor: ${inv.contact}, ${inv.company}\nPhone: ${inv.phone}\nInvoice: ${inv.invoiceNo}\nBase Amount: ${fmtINR(inv.amount)}\nMSMED Act Penalty: ${fmtINR(penalty)}\nTotal Legal Claim: ${fmtINR(totalClaim)}\nDays Overdue: ${inv.daysOverdue}\nSender: ${settings.businessName} (${settings.ownerName})\nTone: firm, cite MSMED Act 2006. Max 5 lines. State exact penalty and total claim.`
            : `Draft a WhatsApp recovery message for:\nDebtor: ${inv.contact}, ${inv.company}\nPhone: ${inv.phone}\nInvoice: ${inv.invoiceNo} for ${fmtINR(inv.amount)}\nDue: ${inv.dueDate} (${inv.daysOverdue} days overdue)\nSender: ${settings.businessName} (${settings.ownerName})\nTone: polite but firm. Max 5 lines. Include payment UPI request mention.`;
          try {
            const msg = await callAI(SYSTEM_PROMPT, prompt);
            if (!cancelled) setAiMsg(msg);
          } catch (e) {
            if (!cancelled) setAiMsg(`Error generating message: ${e.message}`);
          }
          if (!cancelled) setLoading(false);
        }
        generate();
        return () => { cancelled = true; };
      }, [currentIdx, finished]);

      function sendAndNext() {
        if (!inv || !aiMsg) return;
        // Open WhatsApp for the current debtor
        sendViaWhatsApp(inv.phone, aiMsg);
        setSentCount(c => c + 1);
        advanceToNext();
      }

      function skipAndNext() {
        if (!inv) return;
        setSkippedIds(prev => { const s = new Set(prev); s.add(inv.id); return s; });
        advanceToNext();
      }

      function advanceToNext() {
        if (currentIdx + 1 >= total) {
          setFinished(true);
        } else {
          setCurrentIdx(i => i + 1);
        }
      }

      if (finished) {
        return (
          <div className="overlay" onClick={onClose}>
            <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 480, textAlign: 'center' }}>
              <div style={{ fontSize: 48, marginBottom: 16 }}>🎉</div>
              <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 8, color: 'var(--green)' }}>Campaign Complete!</div>
              <div style={{ fontSize: 14, color: 'var(--text2)', marginBottom: 20, lineHeight: 1.6 }}>
                You processed <strong>{total}</strong> debtor{total !== 1 ? 's' : ''}.<br />
                <span style={{ color: 'var(--green)' }}><strong>{sentCount}</strong> sent via WhatsApp</span>
                {skippedIds.size > 0 && <span> · <span style={{ color: 'var(--text3)' }}>{skippedIds.size} skipped</span></span>}
              </div>
              <div className="progress" style={{ height: 8, marginBottom: 20 }}>
                <div className="progress-fill progress-green" style={{ width: '100%' }}></div>
              </div>
              <button className="btn btn-primary btn-lg" onClick={onClose} style={{ padding: '12px 40px' }}>Done</button>
            </div>
          </div>
        );
      }

      if (!inv) return null;

      const claim = inv.interest_data?.total_claim || inv.amount;

      return (
        <div className="overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="modal modal-lg" onClick={e => e.stopPropagation()} style={{ maxWidth: 640 }}>
            {/* Header with progress */}
            <div className="modal-header">
              <div>
                <div className="modal-title">💬 WhatsApp Campaign Runner</div>
                <div className="modal-sub">Process each debtor one at a time — no popup blockers!</div>
              </div>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>

            {/* Progress Bar */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--amber-dark)' }}>Sending {currentIdx + 1} of {total}</span>
                <span style={{ fontSize: 12, color: 'var(--text3)' }}>{sentCount} sent · {skippedIds.size} skipped</span>
              </div>
              <div className="progress" style={{ height: 8 }}>
                <div className="progress-fill progress-amber" style={{ width: progressPct + '%', transition: 'width 0.4s ease' }}></div>
              </div>
            </div>

            {/* Current Debtor Card */}
            <div style={{ background: 'var(--surface2)', borderRadius: 'var(--radius-lg)', padding: '16px 18px', marginBottom: 16, border: '1px solid var(--border)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--amber-bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, color: 'var(--amber-dark)' }}>{getInitials(inv.company)}</div>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700 }}>{inv.company}</div>
                    <div style={{ fontSize: 12, color: 'var(--text3)' }}>{inv.contact} · {inv.phone}</div>
                  </div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <span className={`badge ${daysBadge(inv.daysOverdue, false)}`}>{inv.daysOverdue}d overdue</span>
                  <div style={{ fontSize: 15, fontWeight: 800, marginTop: 4, color: 'var(--amber)' }}>{fmtINR(claim)}</div>

    function AddInvoiceModal({ onClose, onAdd }) {
      const [form, setForm] = useState({ company: '', contact: '', phone: '', email: '', gstin: '', amount: '', invoiceNo: '', issueDate: '', dueDate: '', channel: 'WhatsApp', industry: 'Services', notes: '', city: '', proof_url: '' });
      const [uploading, setUploading] = useState(false);
      const [debtorUrl, setDebtorUrl] = useState('');
      const [enriching, setEnriching] = useState(false);

      const upd = (k, v) => setForm(p => ({ ...p, [k]: v }));

      async function uploadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const fd = new FormData();
        fd.append('file', file);
        try {
          const res = await authFetch('/api/invoices/upload-proof', { method: 'POST', body: fd });
          const data = await res.json();
          if (res.ok) upd('proof_url', data.proof_url);
        } catch (e) { console.error('Upload error', e); }
        setUploading(false);
      }

      async function handleEnrich() {
        if (!debtorUrl) return alert('Enter a website URL first');
        setEnriching(true);
        try {
          // ensure protocol
          const urlToFetch = debtorUrl.startsWith('http') ? debtorUrl : `https://${debtorUrl}`;
          const res = await authFetch('/api/enrich', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlToFetch })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Failed to fetch data');

          let updates = {};
          if (data.email) updates.email = data.email;
          if (data.phone) updates.phone = data.phone;

          if (Object.keys(updates).length > 0) {
            setForm(p => ({ ...p, ...updates }));
            alert(`Auto-filled ${Object.keys(updates).join(' and ')}!`);
          } else {
            alert('No contact info found on that page.');
          }
        } catch (e) {
          alert('Scraping error: ' + e.message);
        }
        setEnriching(false);
      }

      function submit() {
        if (!form.company || !form.amount || !form.dueDate || !form.invoiceNo) return alert('Fill required fields (*)');
        onAdd({ ...form, amount: parseInt(form.amount) || 0 });

                  {enriching ? <><span className="spinner"></span>Extracting...</> : 'Auto-Fill'}

              <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 8 }}>Extracts Email and Phone automatically</div>

    /* ─── INVOICE DETAIL MODAL ─── */
    function InvoiceDetailModal({ inv, settings, onClose, onRecover, onDelete }) {
      // Store a message per tab so switching tabs doesn't wipe the draft
      const [aiMsgs, setAiMsgs] = useState({ whatsapp: '', email: '', legal: '' });
      const [loading, setLoading] = useState(false);
      const [msgType, setMsgType] = useState('whatsapp');
      const [copied, setCopied] = useState(false);
      const [confirm, setConfirm] = useState(false);
      const [tone, setTone] = useState('Firm Warning');
      const aiMsg = aiMsgs[msgType] || '';

      // Safe interest_data access
      const id = inv.interest_data || {};
      const penalty = id.interest_accrued || 0;
      const totalClaim = id.total_claim || inv.amount;
      const hasInterest = !!(inv.interest_data && penalty > 0);
      const isLegal = inv.daysOverdue >= 45 && !inv.recovered;

      async function gen() {
        setLoading(true); setCopied(false);
        const prompts = {
          whatsapp: isLegal
            ? `WhatsApp message for ${inv.contact} at ${inv.company}.\nNotice: Your payment of ${fmtINR(inv.amount)} (Invoice ${inv.invoiceNo}) is ${inv.daysOverdue} days overdue. Under the MSMED Act 2006, a legal penalty of ${fmtINR(penalty)} has accrued. Your total payable amount is now ${fmtINR(totalClaim)}. Please clear this immediately to avoid formal legal proceedings.\nSender: ${settings.businessName}. Rewrite this in a professional WhatsApp format, 4-5 lines, firm tone.`
            : `WhatsApp message for ${inv.contact} at ${inv.company} for invoice ${inv.invoiceNo} of ${fmtINR(inv.amount)}, ${inv.daysOverdue} days overdue. Sender: ${settings.businessName}. Polite but firm, 3-4 lines.`,
          email: isLegal
            ? `Professional email to ${inv.contact} <${inv.email}> at ${inv.company}.\nSubject should reference MSMED Act penalty.\nInvoice ${inv.invoiceNo}, Base Amount: ${fmtINR(inv.amount)}, Penalty: ${fmtINR(penalty)}, Total Claim: ${fmtINR(totalClaim)}, ${inv.daysOverdue} days overdue.\nSender: ${settings.businessName}. Cite MSMED Act 2006 §15-17. Demand immediate payment. Mention MSME Samadhaan filing.`
            : `Professional follow-up email to ${inv.contact} <${inv.email}> at ${inv.company} for invoice ${inv.invoiceNo} of ${fmtINR(inv.amount)}, ${inv.daysOverdue} days overdue. Sender: ${settings.businessName}. Include Subject line.`,
          legal: `Formal MSME legal notice for ${inv.company} (contact: ${inv.contact}).\nInvoice ${inv.invoiceNo}, Base Amount: ${fmtINR(inv.amount)}.\nMSMED Act Penalty: ${fmtINR(penalty)} (19.5% p.a. compound with monthly rests).\nTotal Legal Claim: ${fmtINR(totalClaim)}.\n${inv.daysOverdue} days overdue.\nSender: ${settings.businessName} (${settings.ownerName}).\nMSMED Act 2006, 15-day demand. Include exact penalty and total claim amounts.`,
        };
        const tab = msgType;
        try { const m = await callAI(SYSTEM_PROMPT, prompts[tab], inv, tone); setAiMsgs(prev => ({ ...prev, [tab]: m })); }
        catch (e) { setAiMsgs(prev => ({ ...prev, [tab]: `Error: ${e.message}` })); }
        setLoading(false);
      }

      const tl = [
        { l: 'Invoice Issued', d: `${inv.invoiceNo} for ${fmtINR(inv.amount)}`, done: true, dot: 'done' },
        { l: '1st Reminder', d: 'Day 7 — Polite first reminder', done: inv.reminders >= 1, dot: inv.reminders >= 1 ? 'done' : inv.daysOverdue >= 7 ? 'active' : 'pending' },
        { l: 'Follow-up', d: 'Day 21 — Second reminder', done: inv.reminders >= 2, dot: inv.reminders >= 2 ? 'done' : inv.daysOverdue >= 21 ? 'active' : 'pending' },
        { l: 'Final Notice', d: 'Day 35 — Escalation message', done: inv.reminders >= 3, dot: inv.reminders >= 3 ? 'done' : inv.daysOverdue >= 35 ? 'active' : 'pending' },
        { l: 'Legal Draft', d: 'Day 45+ — MSME notice', done: inv.daysOverdue >= 45, dot: inv.daysOverdue >= 45 ? 'legal' : 'pending' },
        { l: 'Recovered', d: 'Invoice paid and closed', done: inv.recovered, dot: inv.recovered ? 'done' : 'pending' },
      ];

      return (
        <div className="overlay" onClick={e => { if (e.target === e.currentTarget) onClose() }}>
          <div className="modal modal-lg" style={{ maxWidth: 780 }}>
            <div className="modal-header">
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: 'var(--amber-bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700, color: 'var(--amber-dark)' }}>{getInitials(inv.company)}</div>
                  <div>
                    <div className="modal-title">{inv.company}</div>
                    <div className="modal-sub">{inv.contact} · {inv.phone} · {inv.city}</div>
                  </div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <span className={`badge ${daysBadge(inv.daysOverdue, inv.recovered)}`}>{inv.recovered ? 'Recovered' : STATUS_META[inv.status]?.label}</span>
                <button className="close-btn" onClick={onClose}>×</button>
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              {/* Left */}
              <div>
                <div className="detail-grid" style={{ marginBottom: 12 }}>
                  {[['Invoice No', inv.invoiceNo], ['Amount', fmtINR(inv.amount)], ['Due Date', inv.dueDate], ['Days Overdue', inv.recovered ? '—' : inv.daysOverdue + 'd'], ['Channel', inv.channel], ['Industry', inv.industry], ['GSTIN', inv.gstin || '—'], ['Reminders Sent', inv.reminders + '/4']].map(([l, v]) => (
                    <div key={l} className="detail-item"><div className="detail-label">{l}</div><div className="detail-value" style={{ fontSize: 12 }}>{v}</div></div>
                  ))}
                </div>

                {/* ── Legal Claim Breakdown (shows when interest_data exists) ── */}
                {hasInterest && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 8 }}>⚖ Legal Claim Breakdown</div>
                    <div style={{ borderRadius: 'var(--radius)', overflow: 'hidden', border: '1px solid var(--border)' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '9px 12px', background: 'var(--surface2)', borderBottom: '1px solid var(--border)' }}>
                        <span style={{ fontSize: 12, color: 'var(--text2)' }}>Base Invoice Amount</span>
                        <span style={{ fontSize: 12, fontWeight: 600 }}>{fmtINR(inv.amount)}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '9px 12px', background: 'var(--red-bg)', borderBottom: '1px solid var(--border)' }}>
                        <span style={{ fontSize: 12, color: 'var(--red)' }}>MSMED Penalty (19.5% p.a. compound)</span>
                        <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--red)' }}>+{fmtINR(penalty)}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 12px', background: 'var(--surface)' }}>
                        <span style={{ fontSize: 13, fontWeight: 700 }}>Total Legal Claim</span>
                        <span style={{ fontSize: 15, fontWeight: 800, color: 'var(--red)' }}>{fmtINR(totalClaim)}</span>
                      </div>
                    </div>
                    <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 4, textAlign: 'right' }}>{id.legal_basis || 'MSMED Act 2006, §15–17 @ 3× RBI Bank Rate'}</div>
                  </div>
                )}

                {inv.notes && <div className="info-box" style={{ fontSize: 11, marginBottom: 12 }}><strong>Notes:</strong> {inv.notes}</div>}
                {inv.proof_url && (
                  <div style={{ marginBottom: 12 }}>
                    <button className="btn btn-sm" onClick={() => window.open(inv.proof_url, '_blank')}>📄 View Proof of Delivery</button>
                  </div>
                )}

                <div style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 8 }}>Recovery Timeline</div>
                  <div className="timeline">
                    {tl.map((t, i, a) => (
                      <div key={i} className="timeline-item">
                        <div className="timeline-left">
                          <div className={`timeline-dot ${t.dot}`}></div>
                          {i < a.length - 1 && <div className="timeline-line"></div>}
                        </div>
                        <div className="timeline-content">
                          <div className="timeline-title" style={{ color: t.done ? 'var(--text)' : 'var(--text3)', fontSize: 12 }}>{t.l}</div>
                          <div className="timeline-desc">{t.d}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {!inv.recovered && (
                  <div style={{ display: 'flex', gap: 6 }}>
                    {!confirm
                      ? <button className="btn btn-success" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirm(true)}>✓ Mark as Recovered</button>
                      : <>
                        <button className="btn btn-success" style={{ flex: 1, justifyContent: 'center' }} onClick={onRecover}>Confirm Recovery</button>
                        <button className="btn" onClick={() => setConfirm(false)}>Cancel</button>
                      </>
                    }
                    <button className="btn btn-danger btn-sm" title="Delete invoice" onClick={onDelete}>🗑</button>
                  </div>
                )}
              </div>

              {/* Right */}
              <div>
                <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.4px', marginBottom: 8 }}>AI Message Generator</div>
                <div className="tabs">
                  {[['whatsapp', '💬 WA'], ['email', '📧 Email'], ['legal', '⚖ Legal']].map(([v, l]) => (
                    <button key={v} className={`tab-btn${msgType === v ? ' active' : ''}`} onClick={() => setMsgType(v)}>{l}</button>
                  ))}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', marginBottom: 10 }}>
                  <select value={tone} onChange={(e) => setTone(e.target.value)} style={{ padding: '8px', borderRadius: '4px', marginRight: '10px', border: '1px solid var(--border-color)', background: 'var(--surface)' }}><option value="Polite Reminder">Polite Reminder</option><option value="Firm Warning">Firm Warning</option><option value="Final Legal Threat">Final Legal Threat</option></select>
                  <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={gen} disabled={loading}>
                    {loading ? <><span className="spinner"></span>Generating...</> : `Generate ${msgType === 'whatsapp' ? 'WhatsApp' : msgType === 'email' ? 'Email' : 'Legal Notice'}`}
                  </button>
                </div>
                {loading && <div className="ai-loading"><span className="spinner"></span>AI drafting...</div>}
                {aiMsg && !loading && (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
                      <span style={{ fontSize: 10, color: 'var(--text3)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.4px' }}>Draft</span>
                      <button className={`btn btn-sm${copied ? ' copy-flash' : ''}`} onClick={() => { navigator.clipboard.writeText(aiMsg).catch(() => { }); setCopied(true); setTimeout(() => setCopied(false), 2000); }}>{copied ? '✓ Copied' : 'Copy'}</button>
                    </div>
                    <div className="ai-box" style={{ fontSize: 11, maxHeight: 260 }}>{aiMsg}</div>
                    <div style={{ marginTop: 10, display: 'flex', gap: 6, justifyContent: 'flex-end', flexWrap: 'wrap' }}>
                      {msgType === 'whatsapp' && <button className="btn btn-sm btn-success" onClick={() => sendViaWhatsApp(inv.phone, aiMsg)} title="Open WhatsApp with this message pre-filled">💬 Send via WhatsApp</button>}
                      {msgType === 'email' && <button className="btn btn-sm btn-success" onClick={() => { const subject = encodeURIComponent(`Overdue Invoice ${inv.invoiceNo} — Action Required`); const body = encodeURIComponent(aiMsg); window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(inv.email)}&su=${subject}&body=${body}`, '_blank'); }} title="Open Gmail compose window">📧 Send via Gmail</button>}
                      {msgType === 'legal' && <button className="btn btn-sm btn-danger" onClick={() => generateLegalPDF(inv, settings)} title="Download a formal PDF Legal Notice">📄 Download PDF Notice</button>}
                    </div>
                  </div>
                )}
                {!aiMsg && !loading && (
                  <div style={{ textAlign: 'center', padding: '30px 12px', color: 'var(--text3)', fontSize: 12, background: 'var(--surface2)', borderRadius: 'var(--radius)', border: '1px dashed var(--border)' }}>
                    Select a message type and click Generate
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── CUSTOMERS PAGE ─── */
    function Customers({ invoices, openDetail }) {
      const customersMap = {};
      invoices.forEach(inv => {
        if (!customersMap[inv.company]) {
          customersMap[inv.company] = { company: inv.company, contact: inv.contact, email: inv.email, phone: inv.phone, invoices: [], totalOutstanding: 0, totalRecovered: 0 };
        }
        customersMap[inv.company].invoices.push(inv);
        if (inv.recovered) customersMap[inv.company].totalRecovered += inv.amount;
        else customersMap[inv.company].totalOutstanding += inv.amount;
      });
      const customers = Object.values(customersMap).sort((a, b) => b.totalOutstanding - a.totalOutstanding);

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Customers</div>
              <div className="page-sub">Manage your debtors and clients</div>
            </div>
          </div>
          <div className="content">
            <div className="card" style={{ padding: 0 }}>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Customer Name</th>
                      <th>Contact Details</th>
                      <th>Total Invoices</th>
                      <th>Outstanding (₹)</th>
                      <th>Recovered (₹)</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {customers.length === 0 && (
                      <tr><td colSpan={6} style={{ textAlign: 'center', padding: 40 }}>No customers found.</td></tr>
                    )}
                    {customers.map((c, i) => {
                      const hasLegal = c.invoices.some(inv => !inv.recovered && inv.daysOverdue >= 45);
                      return (
                        <tr key={i} className="mobile-table-row">
                          <td data-label="Customer" className="mobile-td">
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                              <div style={{ width: 30, height: 30, borderRadius: 6, background: 'var(--amber-bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: 'var(--amber-dark)', flexShrink: 0 }}>{getInitials(c.company)}</div>
                              <div style={{ fontWeight: 600, fontSize: 13 }}>{c.company}</div>
                            </div>
                          </td>
                          <td data-label="Contact" className="mobile-td">
                            <div style={{ fontSize: 12 }}>{c.contact}</div>
                            <div style={{ fontSize: 11, color: 'var(--text3)' }}>{c.email} | {c.phone}</div>
                          </td>
                          <td data-label="Invoices" className="mobile-td">{c.invoices.length}</td>
                          <td data-label="Outstanding" className="mobile-td"><strong>{fmtINR(c.totalOutstanding)}</strong></td>
                          <td data-label="Recovered" className="mobile-td" style={{ color: 'var(--green)' }}>{fmtINR(c.totalRecovered)}</td>
                          <td data-label="Status" className="mobile-td"><span className={`badge ${hasLegal ? 'badge-red' : c.totalOutstanding > 0 ? 'badge-amber' : 'badge-green'}`}>{hasLegal ? 'High Risk' : c.totalOutstanding > 0 ? 'Active' : 'Clear'}</span></td>
                        </tr>
                      )
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── REMINDERS PAGE ─── */
    function Reminders({ invoices, openDetail }) {
      const active = invoices.filter(i => !i.recovered && i.daysOverdue > 0).sort((a, b) => b.daysOverdue - a.daysOverdue);

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Reminders Schedule</div>
              <div className="page-sub">Upcoming and past automated follow-ups</div>
            </div>
          </div>
          <div className="content">
            <div className="card">
              <div className="card-header" style={{ marginBottom: 16 }}>
                <div className="card-title">Pending Reminders Queue</div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {active.length === 0 && <div className="empty" style={{ padding: 40, textAlign: 'center', color: 'var(--text3)' }}>No pending reminders.</div>}
                {active.map(inv => {
                  let nextAction = '';
                  let badge = '';
                  if (inv.daysOverdue >= 45) { nextAction = 'File MSME Samadhaan Case'; badge = 'badge-red'; }
                  else if (inv.daysOverdue >= 35) { nextAction = 'Send Final Legal Notice'; badge = 'badge-red'; }
                  else if (inv.daysOverdue >= 21) { nextAction = 'Send Warning Email & WhatsApp'; badge = 'badge-amber'; }
                  else { nextAction = 'Send Gentle Follow-up'; badge = 'badge-blue'; }

                  return (
                    <div key={inv.id} style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 'var(--radius)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{inv.company} <span style={{ color: 'var(--text3)', fontWeight: 400 }}>({inv.invoiceNo})</span></div>
                        <div style={{ fontSize: 11, color: 'var(--text2)', marginTop: 4 }}>Due {inv.dueDate} &mdash; <strong style={{ color: 'var(--red)' }}>{inv.daysOverdue} days overdue</strong></div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <span className={`badge ${badge}`}>{nextAction}</span>
                        <button className="btn btn-sm btn-primary" onClick={() => openDetail(inv)}>Review &rarr;</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── REPORTS PAGE ─── */
    function Reports({ invoices, outstanding, recovered, recoveryRate }) {
      const active = invoices.filter(i => !i.recovered);
      const aging = {
        '0-30': active.filter(i => i.daysOverdue >= 0 && i.daysOverdue <= 30).reduce((s, i) => s + i.amount, 0),
        '31-60': active.filter(i => i.daysOverdue > 30 && i.daysOverdue <= 60).reduce((s, i) => s + i.amount, 0),
        '60-90': active.filter(i => i.daysOverdue > 60 && i.daysOverdue <= 90).reduce((s, i) => s + i.amount, 0),
        '90+': active.filter(i => i.daysOverdue > 90).reduce((s, i) => s + i.amount, 0),
      };

      return (
        <div>
          <div className="topbar">
            <div>
              <div className="page-title">Financial Reports</div>
              <div className="page-sub">Exportable insights and aging summaries</div>
            </div>
            <div className="topbar-actions">
              <button className="btn btn-primary" onClick={() => alert('PDF generation started...')}>&darr; Export PDF</button>
            </div>
          </div>
          <div className="content">
            <div className="dashboard-bottom-grid" style={{ gridTemplateColumns: '1fr 1fr' }}>
              <div className="card">
                <div className="card-header" style={{ marginBottom: 16 }}>
                  <div className="card-title">Executive Summary</div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', paddingBottom: 8, borderBottom: '1px solid var(--border)' }}>
                    <span style={{ color: 'var(--text2)' }}>Total Outstanding:</span>
                    <strong style={{ fontSize: 16 }}>{fmtINR(outstanding)}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', paddingBottom: 8, borderBottom: '1px solid var(--border)' }}>
                    <span style={{ color: 'var(--text2)' }}>Total Recovered:</span>
                    <strong style={{ fontSize: 16, color: 'var(--green)' }}>{fmtINR(recovered)}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', paddingBottom: 8, borderBottom: '1px solid var(--border)' }}>
                    <span style={{ color: 'var(--text2)' }}>Recovery Rate:</span>
                    <strong style={{ fontSize: 16, color: 'var(--purple)' }}>{recoveryRate}%</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: 'var(--text2)' }}>High Risk (Legal) Exposure:</span>
                    <strong style={{ fontSize: 16, color: 'var(--red)' }}>{fmtINR(aging['90+'])}</strong>
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header" style={{ marginBottom: 16 }}>
                  <div className="card-title">Aging Summary</div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span>0 - 30 Days</span>
                    <strong style={{ color: 'var(--blue)' }}>{fmtINR(aging['0-30'])}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span>31 - 60 Days</span>
                    <strong style={{ color: 'var(--amber)' }}>{fmtINR(aging['31-60'])}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span>60 - 90 Days</span>
                    <strong style={{ color: 'var(--amber-dark)' }}>{fmtINR(aging['60-90'])}</strong>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span>90+ Days (Severe)</span>
                    <strong style={{ color: 'var(--red)' }}>{fmtINR(aging['90+'])}</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
