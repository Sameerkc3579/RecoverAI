name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # local dev / Vercel runtime
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
      TEST_DB_NAME: recoverai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: pip check
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Babel (same version as dashboard.html)
        run: npm install --no-save --no-package-lock --prefix .ci @babel/standalone@7.24.0
      - name: Compile dashboard components
        run: BABEL_STANDALONE=.ci/node_modules/@babel/standalone node scripts/check_frontend.js
